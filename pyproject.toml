[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openulla"
version = "0.1.0"
description = "An independent implementation of Apple's ULLA setup protocol, for interoperability"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/mstampfli/openulla"

[tool.setuptools]
packages = ["openulla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
