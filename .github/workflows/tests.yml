# The implementation's own checks. No hardware, no dependencies, no network.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest ruff mypy
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m mypy
      - name: the simulated setup still negotiates
        run: |
          python tools/ulla_demo.py
          python tools/ulla_demo.py --reject busy
          python tools/aap_probe.py --simulate --seq start,subscribe,stop
          python tools/ulla_decode.py f6 17 e6
          python tools/ulla_decode.py --sibling 05 01 66 55 44 33 22 11 00
          python tools/ulla_probe.py --dry-run
          python tools/ulla_interop.py --check
          python tools/verify_claims.py --help
          python tools/ulla_sink.py --help
          python tools/capture_decode.py --help
